gemini:
  model_orchestrator: "gemini-pro-latest"
  model_specialist: "gemini-pro-latest"
  model_classifier: "gemini-flash-latest"
  model_vision: "gemini-3.5-flash-lite"
  fallback_chain:
    - "gemini-flash-latest"
    - "gemini-flash-lite-latest"
    - "gemini-3.5-flash"
    - "gemini-3.1-flash-lite"
  max_tokens: 4096

corpus:
  source: "scipost"
  base_url: "https://scipost.org"
  api_url: "https://scipost.org/api"
  year_range: [2020, 2025]

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  vector_store: "data/corpus"

pipeline:
  batch_size: 10
  max_retries: 3
